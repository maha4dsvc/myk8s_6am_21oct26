apiVersion: v1
kind: ReplicationController
metadata:
  name: myrc
spec:
  replicas: 2 
  selector:
    app: myapp
    version: 2.6.1
  template:
    metadata:
      labels:
        app: myapp
        version: 2.6.1
    spec:
      containers:
      - name: mycontainer
        image: maha4iac/mahalogin:1
        ports:
        - containerPort: 8080
